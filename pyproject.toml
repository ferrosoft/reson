[project]
name = "reson"
version = "0.1.0"
description = "1D Seismic Response Analysis."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Francesco Franco", email = "ffrancoa97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
]

[project.scripts]
reson = "reson:main"

[tool.maturin]
module-name = "reson._core"
python-packages = ["reson"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "ipython>=9.13.0",
    "pytest>=9.0.3",
]
